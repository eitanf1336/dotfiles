# Shadows /lib/modprobe.d/nvidia-runtimepm.conf, which Ubuntu's gpu-manager
# rewrites with NVreg_DynamicPowerManagement=0x02 on boot. Runtime power
# management sends the dGPU to D3cold, and resuming from D3cold kills the GSP on
# this RTX 4060 (Xid 119/154, needs a hard reboot). See zz-nvidia-power-fix.conf.
options nvidia "NVreg_DynamicPowerManagement=0x00"
