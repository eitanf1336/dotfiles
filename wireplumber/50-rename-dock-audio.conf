# The two DELL S2725HS screens hang off the DisplayLink DL6950 dock, and their
# speakers are reachable only through the dock's audio device. By default GNOME
# lists that as "Speakers - DL6950 TEST", which reads like a test device rather
# than the screens. Rename it to what it actually drives.
#
# The G2724D on the laptop's HDMI port has no speakers at all, so this dock route
# is the only path to screen audio on this machine.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-DisplayLink_DL6950_TEST_PCT6360100011-02" }
    ]
    actions = {
      update-props = {
        device.description = "Dell Screens"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-DisplayLink_DL6950_TEST_PCT6360100011-02.analog-stereo" }
    ]
    actions = {
      update-props = {
        node.description = "Dell Screens"
        node.nick = "Dell Screens"
      }
    }
  }
]
