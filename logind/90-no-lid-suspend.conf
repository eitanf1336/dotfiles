# Eitan runs this laptop closed, on a dock with three external screens, and
# Claude agents work on it around the clock. A closed lid must never suspend it
# while it is on mains power: that has ended a long agent run twice.
# Battery is left alone on purpose, so an unplugged laptop still protects itself.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
