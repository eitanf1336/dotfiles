# xdg-desktop-portal probes for backends once, at startup, and caches the answer.
# If the GNOME backend happens to be down at that moment the Screenshot interface
# is simply absent for the whole life of the process, and every screenshot fails
# with "No such interface org.freedesktop.portal.Screenshot". Pull the backend up
# first so a restart of this service can never land in that state.
[Unit]
Wants=xdg-desktop-portal-gnome.service
After=xdg-desktop-portal-gnome.service
