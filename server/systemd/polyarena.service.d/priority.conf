[Service]
# Bots first on the server (Eitan, 25 Sep). Renders get CPUWeight=10, see server-priority-guard.
CPUWeight=1000
MemoryLow=3500M
# Trading never stops (Eitan, 3 Oct): the OOM killer killed the core at 05:05 on 3 Oct.
# 100 is the lowest a user unit may set; everything heavy that is not trading sits at 700.
OOMScoreAdjust=100
