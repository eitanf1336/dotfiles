# A stop or restart of arena-live kills the bot clients, so ReplayMod never zips its
# recording into a .mcpr. Once everything is down, pack the leftover .tmp recordings
# (and write the last run's game-time replay). Failure never blocks a restart.
[Service]
ExecStopPost=-%h/code/MyProjects/MinecraftArena/bin/pack-recordings --gametime
