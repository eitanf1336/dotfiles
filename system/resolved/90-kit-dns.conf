# Kit, 7 Oct 2026: the router DNS kept failing (SERVFAIL) and the network drops UDP 53 to outside resolvers,
# which broke every Claude chat login. DNS over TLS to Cloudflare/Google; opportunistic = falls back to plain
# DNS (and the network's own servers) on networks that block port 853, so captive portals still work.
# Kit, 8 Nov 2026: removed "Domains=~." so the network's own DNS is asked IN PARALLEL with the DoT servers
# (resolved takes the first good answer). On TechPublic the DoT link stalls for 5 s now and then, which made
# every new site (claude.ai) take 5 s to open. A SERVFAIL from the network DNS never wins over a real answer.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google 2606:4700:4700::1111#cloudflare-dns.com
FallbackDNS=9.9.9.9#dns.quad9.net 1.0.0.1#cloudflare-dns.com
DNSOverTLS=opportunistic
