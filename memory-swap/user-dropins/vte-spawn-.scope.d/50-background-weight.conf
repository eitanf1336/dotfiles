# Applies to EVERY terminal-spawned process tree (this prefix drop-in is how
# /usr/lib/systemd/user/vte-spawn-.scope.d already configures them).
#
# This is the half that cgroup drop-ins on named services cannot reach: dev
# servers, builds and agent-launched jobs live in these transient scopes, not
# in app.slice. A CPU share of 20 vs the shell's 10000 means a runaway build
# still gets every idle core, but can never take the cores the compositor and
# audio need.
#
# MemoryHigh throttles a scope into reclaim BEFORE it can push the rest of the
# desktop into zram. It is a brake, not a wall: nothing is killed, the job just
# slows down once it is using more than half the machine.
[Scope]
CPUWeight=20
MemoryHigh=7G
