# session.slice sits between user@1000.service and GNOME Shell. cgroup v2
# passes memory protection down the chain, so this link has to reserve some
# too, otherwise the shell's own MemoryMin/MemoryLow are capped to zero and the
# compositor gets swapped out mid-frame (= visible screen jitter).
[Slice]
MemoryMin=1G
MemoryLow=2G
