# app.slice holds the things you are actually looking at and listening to:
# Spotify, Chrome, ZapZap. session.slice holds the terminals, and every Claude
# background job runs in a vte-spawn scope inside it.
#
# Without this, reclaim treats them as equals: a background job that wants 4 GB
# pushes Spotify's pages into swap, Spotify then misses its PipeWire deadline
# and the music glitches. Confirmed 2026-08-21 - the Spotify STREAM took 9
# xruns in ten minutes while the sink itself took zero, which is the signature
# of a stalled producer, not of the DisplayLink dock.
#
# MemoryLow is best-effort, not a reservation: the kernel prefers to reclaim
# from everything else first, and still falls back to app.slice if the machine
# genuinely has nowhere else to go. Nothing is ever killed by this.
[Slice]
MemoryLow=3G

# 2026-08-21, second pass. MemoryLow alone was not enough: Slack was killed
# during startup while swap sat at 100%. MemoryLow is best-effort and the
# kernel WILL reclaim through it when it has nowhere else to go, which is
# exactly the situation a runaway agent fleet creates. MemoryMin is the hard
# floor underneath it: these pages are never reclaimed, so an app that is
# already open stays open and an app that is starting can finish starting.
# Kept small on purpose. It is a floor for the desktop, not a reservation.
MemoryMin=1G

# 2026-09-20, third pass. MemoryMin=1G here was shared with session.slice's own
# 1G out of a 1G parent, so app.slice's EFFECTIVE floor was ~512M: less than
# Spotify alone needs, and it showed (6.4M major faults in the renderer). Raised
# to 2G, with user.slice / user-.slice / user@.service raised to 3G to match, so
# the floor actually reaches the app that is claiming it.
MemoryMin=2G
