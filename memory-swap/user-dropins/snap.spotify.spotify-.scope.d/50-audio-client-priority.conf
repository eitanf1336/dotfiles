# Spotify's snap scope is transient and named with a fresh UUID every launch,
# so it is reachable only through this "-" prefix drop-in (the same mechanism
# /usr/lib/systemd/user/vte-spawn-.scope.d uses for terminal scopes).
#
# Why it needs one: the glitch is on the *producer* side. pw-top shows the
# spotify stream taking xruns while the DisplayLink sink takes zero, meaning
# Spotify missed its deadline handing PipeWire the next buffer. So the process
# that must never be starved of CPU or paged out is Spotify itself, not just
# the audio server (which already has 50-audio-priority.conf).
#
# CPUWeight is well above the 20 given to terminal-spawned background jobs;
# MemoryLow keeps its working set out of zram. Neither can kill anything.
[Scope]
CPUWeight=3000
MemoryLow=512M
