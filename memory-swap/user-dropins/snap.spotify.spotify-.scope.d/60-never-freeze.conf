# 2026-09-20. "Spotify keeps freezing."
#
# Measured, not guessed: the renderer process had taken 6,465,174 MAJOR page
# faults and the main process 3,019,852, with 650 MB of the app sitting inside
# zram, while the scope's own memory.events counted 6.2 MILLION low-protection
# breaches. Every click was waiting on hundreds of megabytes being decompressed
# back out of zram. That is the freeze, in full.
#
# 50-audio-client-priority.conf already gave it CPUWeight and MemoryLow=512M,
# but MemoryLow is best-effort and vm.swappiness here is 180: under a loaded
# machine the kernel reclaims straight through it, which is exactly what the
# 6.2M breach counter records.
#
# So two harder knobs:
#   MemorySwapMax=0  Spotify's anonymous pages can never enter swap again. Not
#                    a limit and not a kill: the kernel simply has to keep them
#                    resident or reclaim file pages instead. This is the one
#                    that ends the stutter, because zram round-trips are what
#                    the app was blocking on.
#   MemoryMin        a HARD floor (unlike MemoryLow), so its mapped code pages
#                    are not evicted back to the snap's squashfs either, which
#                    is the other half of the major-fault count. Needs the
#                    ancestor slices to reserve as much, hence the matching
#                    bumps in app.slice.d and /etc/systemd/system/user*.
#
# Neither knob can OOM-kill anything: no memory.max, no memory.high.
[Scope]
MemoryMin=1200M
MemoryLow=2G
MemorySwapMax=0
IOWeight=1000
