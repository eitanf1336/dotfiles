# Keep the desktop responsive while heavy work runs in terminals.
#
# WHY THIS EXISTS: session.slice had `cgroup.subtree_control = memory pids`,
# with no `cpu`. That meant GNOME Shell's cgroup had no cpu.weight file at all,
# so the compositor competed with every terminal-spawned compile / dev server /
# inference job as a plain bag of threads. A 13-thread job would take 13 of 20
# CPUs and the desktop stuttered. Setting CPUWeight here makes systemd enable
# the cpu controller in session.slice, which is what actually creates the knob.
#
# CPUWeight is a SHARE, not a cap: under no contention the shell is unaffected
# and background jobs still get the whole machine. It only decides who yields
# when the CPU is full, and there the compositor must win.
#
# MemoryMin is hard reclaim protection (memory.low, already 1G from GNOME, is
# only soft, and gnome-shell was sitting on 135 MB of swap because of it). A
# compositor paged out to zram is exactly the "everything is molasses" feeling.
[Service]
CPUWeight=10000
MemoryMin=768M
MemoryLow=1500M
