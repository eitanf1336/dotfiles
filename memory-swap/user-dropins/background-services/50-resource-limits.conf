# A parked dev server must never be able to make the laptop unusable.
#
# CPUQuota is a hard ceiling in percent of ONE core, so 800% = 8 of the 20
# hardware threads. DistillSignal's ONNX text scorer creates its InferenceSession
# with no SessionOptions, so ORT defaults intra_op_num_threads to the physical
# core count (14) and takes 13 threads for a single /api/v1/process request.
# That is the single biggest cause of desktop stutter on this box.
#
# CPUWeight puts these below interactive work when the CPU is full, and
# MemoryHigh throttles them into reclaim instead of letting them swap the
# desktop out. Nothing here kills anything.
[Service]
CPUQuota=800%
CPUWeight=30
MemoryHigh=2G
MemoryMax=3G
Nice=5
