# Pass memory protection down to GNOME Shell, which sets its own MemoryMin /
# MemoryLow but cannot use them unless its ancestors reserve some too.
# See /usr/local/lib/gpu-primary-guard sibling notes and the dotfiles repo.
#
# 2026-09-20: raised 1G/2G -> 3G/4G. cgroup v2 hands a child no more protection
# than its parent reserves, and it splits that between siblings, so with 1G here
# app.slice (2G) and session.slice (1G) were both squeezed to ~512M effective
# and Spotify inside app.slice fell through the floor: 6.4M major page faults in
# its renderer, 650 MB of it living in zram, and a UI that froze on every click.
# 3G of 14G is still only a no-reclaim floor for the visible desktop; nothing is
# capped and nothing can be killed by this.
[Slice]
MemoryMin=3G
MemoryLow=7G
#
# 2026-09-27: MemoryLow 4G -> 7G so app.slice can hold a 5G claim (Chrome +
# Spotify) next to session.slice's 2G. Claude's terminal scope claims nothing,
# so under pressure its pages are reclaimed first instead of the desktop's.
